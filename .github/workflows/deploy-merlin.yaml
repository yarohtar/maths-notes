name: Deploy to maths.iammerlin.fyi

# Runs whenever Quartz Syncer (or anyone) pushes to v5, or manually from the Actions tab.
on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-merlin
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for git-based modified dates
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # Reached through the Cloudflare tunnel (ssh.iammerlin.fyi), so the EC2 address can change freely.
      # Repo secrets: EC2_SSH_KEY (private key for ec2-user), CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET
      # (Cloudflare Access service token; cloudflared reads the TUNNEL_SERVICE_TOKEN_* env vars).
      - name: Deploy to /var/www/maths
        # If Cloudflare rejects the token, cloudflared waits for a browser login; don't hang.
        timeout-minutes: 5
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ssh.iammerlin.fyi
          HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG2sb5DjMuSXBlOnaGPq+IQLiOrSGaM84AvlEWF8S0Jm
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$TUNNEL_SERVICE_TOKEN_ID" ] || [ -z "$TUNNEL_SERVICE_TOKEN_SECRET" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::EC2_SSH_KEY / CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET repo secrets are not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$HOST $HOST_KEY" > ~/.ssh/known_hosts
          rsync -az --delete --stats \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o ProxyCommand="cloudflared access ssh --hostname %h"' \
            public/ ec2-user@"$HOST":/var/www/maths/
