name: Refresh All Files on Push

on:
  push:
    branches:
      - v4

jobs:
  trigger-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Call Google Apps Script Web App to Refresh
        run: curl "https://script.google.com/macros/s/AKfycbzg7A6U20MD7WvfPWP8CXYeMt0mcY_wfb6vNtnjI-LKdA2mZDtEilcfGyjqaQQUhSUr/exec?token=$GAS_REFRESH_TOKEN"
