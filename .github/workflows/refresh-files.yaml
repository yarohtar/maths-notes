name: Refresh All Files on Push

on:
  push:
    branches:
      - v4

jobs:
  trigger-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Call Google Apps Script Web App to Refresh
        run: curl "https://script.google.com/macros/s/AKfycbzAYrLcOWSraU4lrvVA7AGMdGmXubb8-qK8kiLrUioE7skD5tMsaKO1njdHqmEi-nUi/exec?token=$GAS_REFRESH_TOKEN"
