# Included from the maths.iammerlin.fyi server block.
# Only requests arriving through the Cloudflare tunnel (cloudflared -> localhost) are allowed,
# so Cloudflare Access on /admin can't be bypassed via the server's public IP.
location /api/ {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Client-IP $http_cf_connecting_ip;
}
location /admin {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Client-IP $http_cf_connecting_ip;
}
